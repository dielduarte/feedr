[package]
name = "feedr"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.0"
chrono = "0.4.45"
feed-rs = "2.4.0"
hex = "0.4.3"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
