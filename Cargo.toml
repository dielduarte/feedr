[package]
name = "feedr"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.0"
axum = "0.8.9"
chrono = "0.4.45"
feed-rs = "2.4.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "http2"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.53.1", features = ["rt"] }
