name: feedrsauros

services:
  feedrsauros:
    build: .
    image: feedrsauros
    restart: unless-stopped
    init: true
    ports:
      # Reachable from this machine only: feedrsauros has no login. To use it from other devices,
      # put it behind a reverse proxy that adds authentication (see README).
      - "127.0.0.1:${FEEDRSAUROS_PORT:-7777}:7777"
    volumes:
      - feedrsauros-data:/data

volumes:
  feedrsauros-data:
